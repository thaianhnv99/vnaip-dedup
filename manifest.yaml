manifestSchemaVersion: 3
appId: vnaip-dedup
version: 1.0.6
displayName: "VNAIP Dedup"
description: "Kiểm tra hồ sơ ứng viên tương tự trong hệ thống VNAIP."
publisher:
  id: local-dev
  displayName: "Local Dev"
  contact: dev@local-dev.example

contributes:
  skills: []
  tools:
    - name: check-duplicates
      description: >-
        Kiểm tra mức độ tương đồng giữa một hồ sơ đầu vào (type là ideas,
        solutions hoặc initiatives) và các sáng kiến CÙNG type đã được duyệt
        và index trong VNAIP (có thể loại bớt bằng excludeIds). Không bao giờ
        so sánh chéo giữa các type. Chỉ dành cho service account của VNAIP BE;
        lời gọi từ người gọi khác bị từ chối (403).
        Cách làm: embed hồ sơ đầu vào, dùng tìm kiếm vector để lọc ra một nhóm
        nhỏ sáng kiến cùng type gần nhất (mặc định 20), rồi để model phân tích
        nội dung đầy đủ và chấm điểm nhóm đó. Sáng kiến nằm ngoài nhóm gần nhất
        không được chấm, nên một sáng kiến trùng ý nhưng diễn đạt rất khác có
        thể không xuất hiện trong kết quả.
        Trả về tối đa 30 sáng kiến giống nhất đã được model chấm và đạt ngưỡng
        điểm tối thiểu (mặc định percent >= 40, nên có thể rỗng). Mỗi mục có
        id, điểm số 0..1 (và percent 0..100), kiểu quan hệ (relation: copy,
        paraphrase, same_problem, same_solution_other_scope, extension hoặc
        unrelated), lý do và bằng chứng (hai đoạn trích nguyên văn, evidence).
        Có thể truyền parentSolutionId (sáng kiến mà hồ sơ kế thừa: không bị
        báo trùng, relation là extension, percent không quá 30) và
        fileExcerpts (đoạn trích từ file đính kèm). Gọi tool này trước khi
        tạo hồ sơ mới để tránh trùng lặp. Caller chịu trách nhiệm diễn giải
        điểm số; đây không phải kết luận trùng lặp cuối cùng.
      route: POST /tools/check-duplicates
      inputSchema: src/schemas/dedup-input.schema.json
      outputSchema: src/schemas/dedup-output.schema.json
      timeoutMs: 30000
      failure_mode: abort

service:
  baseUrl: https://ai-portfolio-project-bujz.onrender.com
health:
  url: https://ai-portfolio-project-bujz.onrender.com/health
  intervalSeconds: 60
environments:
  local:
    service:
      baseUrl: http://localhost:8787
    health:
      url: http://localhost:8787/health
  stg: 
    service:
      baseUrl: https://vnaip-dedup.onrender.com
    health:
      url: https://vnaip-dedup.onrender.com/health
